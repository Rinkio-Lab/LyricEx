name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Full self-check (5 suites)
        run: npm test

      - name: Coverage
        run: npm run test:cov

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E + a11y
        run: npm run e2e
