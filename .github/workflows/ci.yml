name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    # pinned (not ubuntu-latest) so runner-image migrations never change behavior
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Full self-check (5 suites)
        run: npm test

      - name: Coverage
        run: npm run test:cov

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E + a11y
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
